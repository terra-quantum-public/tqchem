context:
  name: ${{ load_from_file("pyproject.toml").project.name }}
  version: ${{ load_from_file("pyproject.toml").project.version }}
  description: ${{ load_from_file("pyproject.toml").project.description }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ../
  # matches the public repository, where this recipe is built; its .gitignore
  # must never cover anything the build needs, notably the pyarmor runtimes
  use_gitignore: true

build:
  noarch: python
  # generated per environment so the shebang matches the installed interpreter
  python:
    entry_points:
      - tqchem = tqchem.__main__:main
  script: pip install . -v

requirements:
  host:
    - pip
    - python >=3.11,<3.13
    - setuptools
    - wheel
  run:
    - python >=3.11,<3.13
    - openff-toolkit >=0.16.5,<0.17
    - tblite-python >=0.4,<0.5
    # the geometry optimizer in 6.4.1 aborts on every input
    - xtb >=6.7.1,<7
    - rdkit >=2025.3.6,<2026
    - networkx >=3.4.1,<4
    - openmm >=8.1.2,<9
    - matplotlib >=3.9.2,<4
    - ase >=3.23.0,<4
    - numpy >=2.1.3,<3
    - py3dmol >=2.4.0,<3
    - keygen-py >=0.2.1,<1
    - py-machineid >=0.6.0,<0.7
    - importlib_resources >=6.5.2,<7
    # crest 3 silently returns a placeholder energy for anything above ~18 atoms
    - crest >=2.12,<3
    - openmmforcefields >=0.14.2, <0.15
    - pandas >=2.2.3,<3
    - plotly >=5.24.1,<6

# TODO: needs environment variable to work
#tests:
#  - python:
#      imports:
#        - tqchem
#      pip_check: false

about:
  description: ${{ description }}
  repository: https://github.com/terra-quantum-public/tqchem
  documentation: https://tqchem-docs.terraquantum.io
